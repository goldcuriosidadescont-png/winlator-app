name: Cerberus PC - v0.3 Display Runtime APK
on:
  push:
    branches: [ 'cerberuspc-display-v0.3.0' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct validated v0.2 and apply v0.3 display overlay
        run: |
          cat ci/v0.2/source.part* > /tmp/CerberusPC-v0.2.0-source.zip
          echo '8c7c657daee523a587ff07bb7ec0565d12bbebac0585bd758cabe28f9a8a6950  /tmp/CerberusPC-v0.2.0-source.zip' | sha256sum -c -
          sha256sum ci/v0.3/overlay.tar.gz
          rm -rf build-v03
          mkdir -p build-v03
          unzip -q /tmp/CerberusPC-v0.2.0-source.zip -d build-v03
          mv build-v03/cerberuspc_v02 build-v03/CerberusPC-v0.3.0
          tar -xzf ci/v0.3/overlay.tar.gz -C build-v03/CerberusPC-v0.3.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Install runtime packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y zstd xz-utils binutils dpkg
      - name: Core tests with sanitizers
        working-directory: build-v03/CerberusPC-v0.3.0
        run: sh tools/test_host.sh
      - name: Java and JNI integration
        working-directory: build-v03/CerberusPC-v0.3.0
        run: sh tools/test_bridge.sh
      - name: Stage Box64 + Proton/Wine runtime
        working-directory: build-v03/CerberusPC-v0.3.0
        run: bash tools/prepare_runtime_ci.sh
      - name: Stage clean-room Cerberus X11 display runtime
        working-directory: build-v03/CerberusPC-v0.3.0
        run: python3 tools/prepare_display_runtime_ci.py
      - name: Validate staged display components
        working-directory: build-v03/CerberusPC-v0.3.0
        run: |
          test -x app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so
          test -x app/src/main/jniLibs/arm64-v8a/libcerberus_xkbcomp.so
          test -s app/src/main/assets/runtime/x11-native-map.properties
          test -s app/src/main/assets/runtime/x11-xkb.tar.gz
          test -s app/src/main/assets/runtime/x11-guest.tar.gz
          readelf -h app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so | grep -E 'AArch64|ARM64'
          tar -tzf app/src/main/assets/runtime/x11-guest.tar.gz | grep -E '(^|/)libX11\.so'
          tar -tzf app/src/main/assets/runtime/x11-guest.tar.gz | grep -E '(^|/)libXext\.so'
      - name: Build and lint ARM64 debug APK
        working-directory: build-v03/CerberusPC-v0.3.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify runtime payload in APK
        run: |
          APK='build-v03/CerberusPC-v0.3.0/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libbox64.so|lib/arm64-v8a/libcerberus_xvfb.so|lib/arm64-v8a/libcerberus_xkbcomp.so|assets/runtime/proton.tar.gz|assets/runtime/prefix-template.tar.gz|assets/runtime/x11-guest.tar.gz|assets/runtime/x11-xkb.tar.gz|assets/runtime/x11-native-map.properties'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcerberus_x11dep_' | head -1
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: CerberusPC-v0.3.0-DisplayRuntime-arm64-debug
          path: build-v03/CerberusPC-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
