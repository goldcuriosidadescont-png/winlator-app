name: Cerberus PC - tests and APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Core tests with sanitizers
        run: sh tools/test_host.sh
      - name: Java and JNI integration
        run: sh tools/test_bridge.sh
      - name: Build and lint ARM64 debug APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CerberusPC-v0.1.0-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
