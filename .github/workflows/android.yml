name: Cerberus PC - containers runtime APK
on:
  push:
    branches: [ 'cerberuspc-containers-v0.2.0' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expand CerberusPC v0.2 source
        run: |
          cat ci/v0.2/source.part* > /tmp/CerberusPC-v0.2.0-Containers-source.zip
          echo '8c7c657daee523a587ff07bb7ec0565d12bbebac0585bd758cabe28f9a8a6950  /tmp/CerberusPC-v0.2.0-Containers-source.zip' | sha256sum -c -
          rm -rf build-v02
          mkdir -p build-v02
          unzip -q /tmp/CerberusPC-v0.2.0-Containers-source.zip -d build-v02
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Install runtime packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y zstd xz-utils
      - name: Core tests with sanitizers
        working-directory: build-v02/CerberusPC-v0.2.0
        run: sh tools/test_host.sh
      - name: Java and JNI integration
        working-directory: build-v02/CerberusPC-v0.2.0
        run: sh tools/test_bridge.sh
      - name: Stage Box64 + Proton/Wine runtime
        working-directory: build-v02/CerberusPC-v0.2.0
        run: bash tools/prepare_runtime_ci.sh
      - name: Build and lint ARM64 debug APK
        working-directory: build-v02/CerberusPC-v0.2.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify runtime payload in APK
        run: |
          APK='build-v02/CerberusPC-v0.2.0/app/build/outputs/apk/debug/app-debug.apk'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libbox64.so|assets/runtime/proton.tar.gz|assets/runtime/prefix-template.tar.gz'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: CerberusPC-v0.2.0-Containers-Runtime-arm64-debug
          path: build-v02/CerberusPC-v0.2.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
