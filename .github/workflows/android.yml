name: Cerberus PC - v0.4.0 Desktop Manager APK
on:
  push:
    branches: [ 'cerberuspc-desktop-manager-v0.4.0' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.3.4 and apply v0.4.0 Desktop Manager
        run: |
          cat ci/v0.3/source64.part* | base64 -d > /tmp/CerberusPC-v0.3.0-source.tar.zst
          echo '55424ea835354ac845317f2efe81e4bb66565a812d725da5294ed00c11cc2990  /tmp/CerberusPC-v0.3.0-source.tar.zst' | sha256sum -c -
          zstd -q -d /tmp/CerberusPC-v0.3.0-source.tar.zst -o /tmp/CerberusPC-v0.3.0-source.tar
          echo '95a077429c7132cb71457e0989b3f3400a363e2451af60d96b380734a2465387  /tmp/CerberusPC-v0.3.0-source.tar' | sha256sum -c -
          rm -rf build-v03
          mkdir -p build-v03
          tar -xf /tmp/CerberusPC-v0.3.0-source.tar -C build-v03

          cat ci/v0.3.1/patch64.part* | base64 -d > /tmp/CerberusPC-v0.3.1-patch.tar.gz
          echo 'ca112aaf3ba94e98e367d87829ead8d55303d6d45481b6c49ea95db81682d593  /tmp/CerberusPC-v0.3.1-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/CerberusPC-v0.3.1-patch.tar.gz -C build-v03/CerberusPC-v0.3.0

          cat ci/v0.3.2/patch64.part* | base64 -d > /tmp/CerberusPC-v0.3.2-patch.tar.gz
          echo '5147a795b75dd88bf32671c54f1a926bb489dd7847057ab94eacd669f2ff333c  /tmp/CerberusPC-v0.3.2-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/CerberusPC-v0.3.2-patch.tar.gz -C build-v03/CerberusPC-v0.3.0

          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-v03/CerberusPC-v0.3.0/app/src/main/java/dev/cerberus/pc/DesktopActivity.java')
          s = p.read_text()
          old = "for (String line : lines) out.append(line).append('\\n');"
          new = "for (String logLine : lines) out.append(logLine).append('\\n');"
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit('diagnostics loop not recognized')
          PY

          cd build-v03/CerberusPC-v0.3.0
          patch -p1 < "$GITHUB_WORKSPACE/ci/v0.3.3/x11-prefix.patch"
          cd "$GITHUB_WORKSPACE"

          cat ci/v0.3.4/patch64.part* | base64 -d > /tmp/CerberusPC-v0.3.4-patch.tar.gz
          echo '8c0dacba97ea73d4508a54a26bdff863cef943dfdcbc61e2c21d91aa00b7e967  /tmp/CerberusPC-v0.3.4-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/CerberusPC-v0.3.4-patch.tar.gz -C build-v03/CerberusPC-v0.3.0

          cat ci/v0.4.0/patch64.part* | base64 -d > /tmp/CerberusPC-v0.4.0-patch.tar.gz
          echo 'b70efdbfe28ca6eda762d64eb44192f4ed0cc7788fa4a2cc66dde66577d0426a  /tmp/CerberusPC-v0.4.0-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/CerberusPC-v0.4.0-patch.tar.gz -C build-v03/CerberusPC-v0.3.0

          cd build-v03/CerberusPC-v0.3.0
          grep -F "versionCode 8" app/build.gradle
          grep -F "versionName '0.4.0-desktop-manager'" app/build.gradle
          grep -F 'reply[8]' app/src/main/java/dev/cerberus/pc/X11ProtocolClient.java
          grep -F 'return reply[9] & 0xff;' app/src/main/java/dev/cerberus/pc/X11ProtocolClient.java
          grep -F 'hasXtest()' app/src/main/java/dev/cerberus/pc/DesktopActivity.java
          grep -F 'continuando boot em modo somente vídeo' app/src/main/java/dev/cerberus/pc/DesktopActivity.java
          grep -F 'x11.pid' app/src/main/java/dev/cerberus/pc/DisplayServerManager.java
          grep -F 'chooseAvailableDisplay' app/src/main/java/dev/cerberus/pc/DisplayServerManager.java
          grep -F 'WINDOWS CONTAINER MANAGER' app/src/main/java/dev/cerberus/pc/MainActivity.java
          grep -F 'VARIÁVEIS DE AMBIENTE' app/src/main/java/dev/cerberus/pc/MainActivity.java
          grep -F 'cerberus-windows-v4' app/src/main/java/dev/cerberus/pc/RuntimeManager.java
          python3 -m py_compile tools/prepare_display_runtime_ci.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'

      - name: Install runtime packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y zstd xz-utils binutils dpkg python3 patch

      - name: Core tests with sanitizers
        working-directory: build-v03/CerberusPC-v0.3.0
        run: sh tools/test_host.sh

      - name: Java and JNI integration
        working-directory: build-v03/CerberusPC-v0.3.0
        run: sh tools/test_bridge.sh

      - name: Stage Box64 Proton Wine and Windows prefix
        working-directory: build-v03/CerberusPC-v0.3.0
        run: |
          bash tools/prepare_runtime_ci.sh
          test -s app/src/main/assets/runtime/proton.cerberus
          test -s app/src/main/assets/runtime/windows-prefix.cerberus
          tar -tzf app/src/main/assets/runtime/proton.cerberus | grep -E '(^|/)bin/wine$'
          tar -tzf app/src/main/assets/runtime/proton.cerberus | grep -E '(^|/)bin/wineserver$'
          tar -tzf app/src/main/assets/runtime/windows-prefix.cerberus | grep -E '(^|/)\.wine/drive_c/windows/system32/' | head -1
          tar -tzf app/src/main/assets/runtime/windows-prefix.cerberus | grep -E '(^|/)\.wine/drive_c/windows/explorer\.exe$'
          tar -tzf app/src/main/assets/runtime/windows-prefix.cerberus | grep -E '(^|/)\.wine/system\.reg$'
          tar -tzf app/src/main/assets/runtime/windows-prefix.cerberus | grep -E '(^|/)\.wine/user\.reg$'

      - name: Stage complete Cerberus X11 XKB XTEST runtime
        working-directory: build-v03/CerberusPC-v0.3.0
        run: python3 tools/prepare_display_runtime_ci.py

      - name: Validate X11 XKB XTEST and Wine libraries
        working-directory: build-v03/CerberusPC-v0.3.0
        run: |
          test -x app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so
          test -x app/src/main/jniLibs/arm64-v8a/libcerberus_xkbcomp.so
          test -s app/src/main/assets/runtime/x11-native-map.properties
          test -s app/src/main/assets/runtime/x11-xkb.cerberus
          test -s app/src/main/assets/runtime/x11-guest.cerberus
          readelf -h app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so | grep -E 'AArch64|ARM64'
          strings app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so | grep -q 'XTEST'
          grep -aF '/data/data/dev.cerberus.pc/xusr/tmp' app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so
          for f in app/src/main/jniLibs/arm64-v8a/libcerberus_xvfb.so app/src/main/jniLibs/arm64-v8a/libcerberus_xkbcomp.so app/src/main/jniLibs/arm64-v8a/libcerberus_x11dep_*.so; do
            if grep -aFq '/data/data/com.termux/files/usr' "$f"; then
              echo "Termux prefix remains in $f" >&2
              exit 1
            fi
          done
          for p in rules/evdev keycodes/evdev types/complete compat/complete symbols/us symbols/pc; do
            tar -tzf app/src/main/assets/runtime/x11-xkb.cerberus | grep -Fx "$p"
          done
          for lib in libX11.so libXext.so libXcursor.so libXi.so libXrandr.so libXrender.so; do
            tar -tzf app/src/main/assets/runtime/x11-guest.cerberus | grep -E "(^|/)${lib//./\\.}$"
          done

      - name: Build and lint ARM64 debug APK
        working-directory: build-v03/CerberusPC-v0.3.0
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify v0.4.0 APK payload
        run: |
          APK='build-v03/CerberusPC-v0.3.0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -tq "$APK"
          python3 - "$APK" <<'PY'
          import io, sys, tarfile, zipfile
          apk=sys.argv[1]
          required=[
              'assets/runtime/proton.cerberus',
              'assets/runtime/windows-prefix.cerberus',
              'assets/runtime/x11-guest.cerberus',
              'assets/runtime/x11-xkb.cerberus',
              'assets/runtime/x11-native-map.properties',
              'lib/arm64-v8a/libbox64.so',
              'lib/arm64-v8a/libcerberus_xvfb.so',
              'lib/arm64-v8a/libcerberus_xkbcomp.so',
          ]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              missing=[x for x in required if x not in names]
              if missing: raise SystemExit('missing APK payload: '+', '.join(missing))
              for name in required[:4]:
                  with z.open(name) as f:
                      if f.read(2) != b'\x1f\x8b': raise SystemExit(name+' gzip magic missing')
              x11_names=[n for n in names if n in {'lib/arm64-v8a/libcerberus_xvfb.so','lib/arm64-v8a/libcerberus_xkbcomp.so'} or n.startswith('lib/arm64-v8a/libcerberus_x11dep_')]
              for name in x11_names:
                  if b'/data/data/com.termux/files/usr' in z.read(name): raise SystemExit('Termux prefix survived: '+name)
              xvfb=z.read('lib/arm64-v8a/libcerberus_xvfb.so')
              if b'XTEST' not in xvfb: raise SystemExit('XTEST support marker missing from packaged Xvfb')
              if b'/data/data/dev.cerberus.pc/xusr/share/X11/xkb/compiled/' not in xvfb:
                  raise SystemExit('XKB compiled directory prefix missing in Xvfb')
              guest=tarfile.open(fileobj=io.BytesIO(z.read('assets/runtime/x11-guest.cerberus')), mode='r:gz')
              guest_names=set(guest.getnames())
              for lib in ['libX11.so','libXext.so','libXcursor.so','libXi.so','libXrandr.so','libXrender.so']:
                  if not any(n.endswith('/'+lib) or n==lib for n in guest_names): raise SystemExit('guest X11 missing '+lib)
              xkb=tarfile.open(fileobj=io.BytesIO(z.read('assets/runtime/x11-xkb.cerberus')), mode='r:gz')
              xkb_names=set(xkb.getnames())
              for p in ['rules/evdev','keycodes/evdev','types/complete','compat/complete','symbols/us','symbols/pc']:
                  if p not in xkb_names: raise SystemExit('XKB missing '+p)
          print('Cerberus v0.4.0 Windows/X11/XKB/XTEST payload verified')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='8'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='0.4.0-desktop-manager'"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: CerberusPC-v0.4.0-DesktopManager-arm64-debug
          path: build-v03/CerberusPC-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
