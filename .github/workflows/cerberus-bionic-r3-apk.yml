name: Cerberus Bionic R3 APK

on:
  push:
    branches:
      - cerberus/bionic-v820-fixed-r3-anr-container-fix
    paths:
      - cerberus-kit/**
      - .github/workflows/cerberus-bionic-r3-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerberus-bionic-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        working-directory: cerberus-kit
        shell: bash

    steps:
      - name: Checkout Cerberus sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Apply exact R3 source overlay
        run: |
          set -euo pipefail
          cat r3-overlay/part-*.b64 > /tmp/cerberus-r3-overlay.tar.gz.b64
          test "$(wc -c < /tmp/cerberus-r3-overlay.tar.gz.b64 | tr -d ' ')" = "37036"
          printf '%s  %s\n' \
            '82c197d5a76128ea112688e2aeb1fe76738eb7561a1d2a56dec5b7335497c75c' \
            '/tmp/cerberus-r3-overlay.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/cerberus-r3-overlay.tar.gz.b64 > /tmp/cerberus-r3-overlay.tar.gz
          printf '%s  %s\n' \
            '5d2b7318c9904abea9e8dc98454f79efecd62b63cd6775369b9559b9c6f9ef70' \
            '/tmp/cerberus-r3-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/cerberus-r3-overlay.tar.gz -C .

          cat > /tmp/r3-files.sha256 <<'EOF'
          a3d5482ba8ef1d3ac534396e555f15d5de768a6b14ddd22556af39e46b3ca794  source/Cerberus/app/build.gradle
          b3abb41c03efed7ffa3e7a6c28d515a397c1e4871eb30174bb9c333af063c8ba  source/Cerberus/app/src/main/java/com/winlator/XServerDisplayActivity.java
          31f5890440d167d62ec6fd0ccb4cffd21820c6f666af361c22313ff9ffa23adc  source/Cerberus/app/src/main/java/com/winlator/container/ContainerManager.java
          2660bbc46d034165cfec33d450105077e9d927cb8e23cd3a959d45937c4d683b  source/Cerberus/app/src/main/java/com/winlator/cerberus/runtime/CerberusRuntimePreflight.java
          45159fb6c2d6001fe55d230efb50c5487f4693219cdd0a845d1bbf18032ed8ac  source/Cerberus/app/src/main/java/com/winlator/cerberus/runtime/CerberusBionicInstaller.java
          ade1412484d270423cc92901b3ea8729c4987639b9eba060de38170889a9505f  source/Cerberus/app/src/main/java/com/winlator/cerberus/diagnostics/CerberusCrashLogger.java
          a8770a5bf5915a59925802961d2c0e220bf9614182cf2557611794459e2bd12f  source/Cerberus/app/src/main/java/com/winlator/core/ProcessHelper.java
          4ccf0ee63f78fafab864996123c59e47d8de078c95925996401ed6765933cb00  source/Cerberus/app/src/main/java/com/winlator/widget/LogView.java
          b6a25652a2c68c9354db29b5e57e9521fa5c49a96ac6cc1d99c9e54c9b7edad6  source/Cerberus/app/src/main/java/com/winlator/xenvironment/components/CerberusBionicProgramLauncherComponent.java
          EOF
          sed -i 's/^          //' /tmp/r3-files.sha256
          sha256sum -c /tmp/r3-files.sha256
          grep -F 'versionCode 822' source/Cerberus/app/build.gradle
          grep -F '8.2.0-Cerberus-Bionic-R3-ANR-Container-Fix' source/Cerberus/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Prepare exact Android toolchain
        run: |
          set -euo pipefail
          mkdir -p output
          command -v sdkmanager
          command -v git-lfs
          test -n "$ANDROID_HOME"
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;24.0.8215888' \
            'cmake;3.22.1' 2>&1 | tee output/toolchain.log
          python3 CONFIGURE-CERBERUS-SDK.py --source source/Cerberus --sdk "$ANDROID_HOME" --no-install
          python3 SYNC-NDK-RUNTIME.py --source source/Cerberus --sdk "$ANDROID_HOME"

      - name: Prepare pinned Bionic donor payload
        run: |
          set -euo pipefail
          rm -rf reference/BionicDonor
          git clone --depth 1 --branch winlator_bionic --single-branch \
            https://github.com/Succubussix/winlator-bionic-glibc.git \
            reference/BionicDonor 2>&1 | tee output/donor-clone.log
          DONOR_HEAD="$(git -C reference/BionicDonor rev-parse HEAD)"
          echo "Bionic donor HEAD=$DONOR_HEAD" | tee output/donor-head.log
          case "$DONOR_HEAD" in
            1a07048*) ;;
            *) echo "Unexpected Bionic donor commit: $DONOR_HEAD" >&2; exit 1 ;;
          esac
          python3 IMPORT-BIONIC-DONOR.py \
            --donor reference/BionicDonor \
            --source source/Cerberus 2>&1 | tee output/import-bionic.log

      - name: Build Cerberus Bionic R3 APK
        run: |
          set -euo pipefail
          cd source/Cerberus
          chmod +x gradlew
          ./gradlew --stop || true
          ./gradlew clean assembleDebug --no-parallel --max-workers=2 2>&1 | tee ../../output/gradle-build.log

      - name: Collect APK into output
        run: |
          set -euo pipefail
          python3 COLLECT-APK.py \
            --source source/Cerberus \
            --kit-root . \
            --output-name Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk 2>&1 | tee output/collect-apk.log
          test -s output/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk

      - name: Verify APK, payload and SHA-256
        run: |
          set -euo pipefail
          APK=output/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee output/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee output/apk-badging.txt
          grep -F "versionCode='822'" output/apk-badging.txt
          grep -F "versionName='8.2.0-Cerberus-Bionic-R3-ANR-Container-Fix'" output/apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          apk = Path('output/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'APK CRC error'
              entries = set(z.namelist())
              required = [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'lib/arm64-v8a/libomp.so',
                  'assets/cerberus-bionic/manifest.json',
              ]
              for item in required:
                  assert item in entries, f'APK missing {item}'
              prefixes = [
                  'assets/cerberus-bionic/imagefs.',
                  'assets/cerberus-bionic/container-pattern-x86_64.',
                  'assets/cerberus-bionic/container-pattern-arm64ec.',
              ]
              for prefix in prefixes:
                  assert any(n.startswith(prefix) for n in entries), f'APK missing {prefix}'

          h = hashlib.sha256()
          with apk.open('rb') as f:
              for block in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(block)
          digest = h.hexdigest()
          Path(str(apk) + '.sha256').write_text(f'{digest}  {apk.name}\n')
          Path('output/apk-size.txt').write_text(str(apk.stat().st_size) + '\n')
          print(f'APK verified: {apk.stat().st_size} bytes; SHA256={digest}')
          PY

      - name: Publish verified R3 APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=output/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk
          SHA_FILE="$APK.sha256"
          TAG="cerberus-bionic-v8.2.0-r3-anr-container-fix-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "$APK#Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk" \
            "$SHA_FILE#Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cerberus Winlator V8.2.0 BIONIC R3 ANR Container Fix" \
            --notes "Compiled from the user-provided R3 ANR/Container Fix source overlay. Exact overlay hashes, Gradle build, APK signature, ZIP CRC, versionCode 822, R3 versionName, and required Bionic/ARM64EC/x86_64 payload checks passed before publication."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets | tee output/release.json

      - name: Split APK for artifact transport
        run: |
          set -euo pipefail
          APK=output/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk
          mkdir -p output/chunks
          rm -f output/chunks/*
          split -b 350M -d -a 2 "$APK" output/chunks/Cerberus-Winlator-V8.2.0-BIONIC-FULL-INTEGRATION.apk.part-
          cp "$APK.sha256" output/chunks/original.apk.sha256
          cp output/apk-size.txt output/chunks/original.apk.size
          ls -lh output/chunks

      - name: Save APK transport parts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cerberus-Bionic-R3-APK-${{ github.run_number }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            cerberus-kit/output/chunks/*
            cerberus-kit/output/apk-signature.txt
            cerberus-kit/output/apk-badging.txt
            cerberus-kit/output/release.json

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cerberus-Bionic-R3-logs-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: cerberus-kit/output/*.log
